name: release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm OIDC trusted publishing (tokenless publish + provenance).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prepack` builds the module against ./.nuxt/tsconfig.json, generated here.
      - name: Prepare
        run: pnpm run dev:prepare

      # Publishing is final, so a missing key has to stop the job before it.
      - name: Require the Cockpit key
        env:
          LAIOUTR_APP_PUBLISH_KEY: ${{ secrets.LAIOUTR_APP_PUBLISH_KEY }}
        run: '[ -n "$LAIOUTR_APP_PUBLISH_KEY" ] || { echo "::error::Add the secret LAIOUTR_APP_PUBLISH_KEY, a key with the app:publish scope"; exit 1; }'

      # Opens/updates a "Version Packages" PR while changesets are pending.
      # When that PR is merged, runs `pnpm release` to build + publish to npmjs.org.
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "chore: release"
          commit: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Registers the version npmjs now serves with the Cockpit, along with laioutr.manifest.json.
      - name: Release the app in the Cockpit
        if: steps.changesets.outputs.published == 'true'
        env:
          LAIOUTR_APP_PUBLISH_KEY: ${{ secrets.LAIOUTR_APP_PUBLISH_KEY }}
        run: pnpm run release:cockpit
